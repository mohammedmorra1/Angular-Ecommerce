<div class="page">

  @if (verifying) {
    <div class="center">
      <p class="verifying-text">VERIFYING PAYMENT...</p>
    </div>
  }

  @if (!verifying && success) {
    <div class="center">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>

      <h1 class="title">ORDER PLACED.</h1>
      <p class="subtitle">You'll get a confirmation by email. Now go look mean.</p>
      @if (orderId) {
        <p class="order-id">ORDER #{{ orderId.slice(0, 8).toUpperCase() }}</p>
      }

      <button class="keep-shopping-btn" (click)="keepShopping()">
        KEEP SHOPPING
      </button>
    </div>
  }

</div>
