<main class="shop-page">
  <div class="shop-header">
    <p class="shop-eyebrow">CATALOGUE</p>
    <h1 class="shop-title">EVERYTHING</h1>
    <app-tabs (selectedCategory)="selector($event)"></app-tabs>
  </div>

  <div class="shop-grid">
    @for (item of products(); track item.id) {
      <div class="shop-grid-item">
        <app-card [cardProduct]="item"></app-card>
      </div>
    }
  </div>

  @if(hasMore()){
    <div class="shop-loadmore">
      <button (click)="loadMore()" class="shop-loadmore-btn">LOAD MORE</button>
    </div>
  }
</main>
