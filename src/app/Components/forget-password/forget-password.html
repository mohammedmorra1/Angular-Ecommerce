<!DOCTYPE html>
<html>
  <body class="bg-dark d-flex justify-content-center align-items-center min-vh-100">

    <div class="form-card">
      <form (submit)="sendResetCode()">

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input [(ngModel)]="email" type="email" name="email" id="email" class="form-control">

          @if(invalidEmail()){
            <p class="error-msg">No account exists for this email</p>
          }
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Submit</button>

      </form>
    </div>

  </body>
</html>
