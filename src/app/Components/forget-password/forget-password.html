<div class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">VANTA/</p>
    <h1 class="auth-title">RESET PASSWORD</h1>

    <form (submit)="sendResetCode()">
      <div class="form-group">
        <label class="auth-label" for="email">EMAIL</label>
        <input [(ngModel)]="email" type="email" name="email" class="auth-input" placeholder="Enter email">

        @if(invalidEmail()){
          <p class="error-msg">NO ACCOUNT EXISTS FOR THIS EMAIL</p>
        }
      </div>

      <button type="submit" class="auth-btn">SUBMIT</button>
    </form>
  </div>
</div>
