<div class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">VANTA/</p>
    <h1 class="auth-title">SIGN IN</h1>

    <form (submit)="Login()">
      <div class="form-group">
        <label class="auth-label" for="username">USERNAME</label>
        <input class="auth-input" name="username" [(ngModel)]="username" placeholder="Enter username">
      </div>

      <div class="form-group">
        <label class="auth-label" for="password">PASSWORD</label>
        <input class="auth-input" name="password" [(ngModel)]="password" type="password" placeholder="Enter password">
      </div>

      @if(invalidCredentials){
        <p class="error-msg">INVALID CREDENTIALS</p>
      }

      <button type="submit" class="auth-btn">LOG IN</button>

      <div class="auth-footer">
        <a routerLink="/forgetpassword" class="auth-link">FORGOT PASSWORD?</a>
        <span class="auth-divider">|</span>
        <a routerLink="/signup" class="auth-link">CREATE ACCOUNT</a>
      </div>
    </form>
  </div>
</div>
