<!DOCTYPE html>
<html>

<body class="bg-dark d-flex justify-content-center align-items-center min-vh-100">

  <div class="rounded border border-light p-4" style="width: 350px;">

    <form (submit)="Login()">

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label text-light">Username</label>
        <input class="form-control" name="username" [(ngModel)]="username">
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label text-light">Password</label>
        <input class="form-control" name="password" [(ngModel)]="password" type="password">
      </div>

      <!-- Error (ALWAYS rendered) -->
      <p class="error-msg">
        @if(invalidCredentials){
          Invalid credentials
        }
      </p>

      <!-- Link -->
      <div class="mb-2">
        <a routerLink="/forgetpassword" class="text-light small">Forget password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100">Log in</button>

    </form>

  </div>

</body>

</html>
